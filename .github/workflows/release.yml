name: .NET Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# Plugins are not bundled: each plugin ships from its own repository through the in-app Plugin
# Store (issue #234, plugin-store.json). The app release contains the app only.
jobs:
  # One leg per Windows architecture. ARM64 builds on a native ARM runner so the NativeAOT setup and
  # uninstaller link with the host toolchain instead of cross-linking from x64 (issue #438).
  build-windows:
    name: Build Windows (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            machine: '8664'
          - rid: win-arm64
            runner: windows-11-arm
            machine: 'AA64'

    env:
      PROJECT_PATH: ./LoupixDeck/LoupixDeck.csproj
      RID: ${{ matrix.rid }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        run: |
          $tag = "$env:GITHUB_REF"
          $version = $tag -replace 'refs/tags/v', ''
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Debug version
        run: echo "Set version to $env:VERSION"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish for Windows
        run: |
          dotnet publish $env:PROJECT_PATH -c Release -r $env:RID --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=false `
            /p:EnableCompressionInSingleFile=true `
            /p:ReadyToRun=true `
            /p:Version=$env:VERSION `
            -o publish/$env:RID

      # Place the native renderer libs (Skia / HarfBuzz / ANGLE) loose next to the single-file exe.
      # The app self-extracts identical libs from its bundle, but a stray copy earlier on the DLL
      # search path can shadow the bundled version and crash the app with a version mismatch; a loose
      # copy in the app directory wins that search-order race. It also lets the setup's NativeBootstrap
      # hoist these root-level libs out of the payload for its own Avalonia UI. A non-single-file
      # publish is used purely to let NuGet resolve the exact matching native versions.
      - name: Harvest native renderer libraries
        run: |
          dotnet publish $env:PROJECT_PATH -c Release -r $env:RID --self-contained true `
            /p:PublishSingleFile=false `
            /p:PublishTrimmed=false `
            /p:ReadyToRun=false `
            /p:Version=$env:VERSION `
            -o publish/$env:RID-natives
          $prefixes = 'libSkiaSharp', 'libHarfBuzzSharp', 'av_'
          $copied = 0
          Get-ChildItem -Path publish/$env:RID-natives -Filter *.dll | ForEach-Object {
            $name = $_.Name
            if ($prefixes | Where-Object { $name.StartsWith($_, [System.StringComparison]::OrdinalIgnoreCase) }) {
              Copy-Item $_.FullName -Destination publish/$env:RID -Force
              $copied++
            }
          }
          if ($copied -eq 0) { throw "No native renderer libraries were harvested" }
          Remove-Item publish/$env:RID-natives -Recurse -Force
          Write-Host "Placed $copied native lib(s) in the payload root."

      - name: Zip Windows build
        run: |
          Get-ChildItem -Path publish/$env:RID -Filter *.pdb -Recurse | Remove-Item -Force
          Compress-Archive -Path publish/$env:RID/* -DestinationPath LoupixDeck-$env:RID.zip

      # Tiny native uninstaller (no payload) — embedded into the setup and written into the install dir.
      - name: Build uninstaller
        run: |
          dotnet publish ./LoupixDeck.Uninstall/LoupixDeck.Uninstall.csproj -c Release -r $env:RID `
            /p:Version=$env:VERSION `
            -o publish/uninstall

      # Native single-exe installer (NativeAOT). The just-built zip IS the payload: its entries
      # (LoupixDeck.exe, ...) sit at the archive root, exactly what the installer's
      # PayloadExtractor expects. Both runners ship the MSVC toolchain ILC needs for AOT linking.
      - name: Build installer
        run: |
          $payload = (Resolve-Path LoupixDeck-$env:RID.zip).Path
          $uninstaller = (Resolve-Path publish/uninstall/LoupixDeck.Uninstall.exe).Path
          dotnet publish ./LoupixDeck.Setup/LoupixDeck.Setup.csproj -c Release -r $env:RID `
            /p:Version=$env:VERSION `
            /p:PayloadZip=$payload `
            /p:UninstallerExe=$uninstaller `
            -o publish/setup
          Copy-Item publish/setup/LoupixDeck.Setup.exe "LoupixDeck-Setup-$env:RID.exe" -Force

      # A wrong-architecture binary in the payload would install fine and then fail to start (or fall
      # back to emulation), so check the PE machine type of every shipped executable and native lib.
      - name: Verify PE machine type
        run: |
          $expected = [Convert]::ToUInt16('${{ matrix.machine }}', 16)
          $files = @(Get-ChildItem -Path publish/$env:RID -Include *.exe, *.dll -Recurse) +
            (Get-Item publish/uninstall/LoupixDeck.Uninstall.exe) +
            (Get-Item "LoupixDeck-Setup-$env:RID.exe")
          $bad = 0
          foreach ($file in $files) {
            $stream = [System.IO.File]::OpenRead($file.FullName)
            try {
              $reader = New-Object System.IO.BinaryReader($stream)
              $stream.Position = 0x3C
              $stream.Position = $reader.ReadInt32() + 4
              $machine = $reader.ReadUInt16()
            }
            finally { $stream.Dispose() }
            if ($machine -ne $expected) {
              Write-Host ("::error::{0}: machine 0x{1:X4}, expected 0x{2:X4}" -f $file.FullName, $machine, $expected)
              $bad++
            }
          }
          if ($bad -gt 0) { throw "$bad binaries have the wrong machine type for $env:RID" }
          Write-Host "Checked $($files.Count) binaries: all 0x${{ matrix.machine }}."

      - name: Upload Windows assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            LoupixDeck-${{ matrix.rid }}.zip
            LoupixDeck-Setup-${{ matrix.rid }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: ./LoupixDeck/LoupixDeck.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish for Linux
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r linux-x64 --self-contained true \
            /p:PublishSingleFile=true \
            /p:PublishTrimmed=false \
            /p:EnableCompressionInSingleFile=true \
            /p:ReadyToRun=true \
            /p:Version=${{ env.VERSION }} \
            -o publish/linux-x64

      - name: Tar Linux build
        run: |
          find publish/linux-x64 -name '*.pdb' -delete
          cd publish/linux-x64
          tar -czvf ../../LoupixDeck-linux-x64.tar.gz .

      - name: Upload Linux tar.gz to release
        uses: softprops/action-gh-release@v3
        with:
          files: LoupixDeck-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The in-app updater (LoupixDeck/Services/Updates) finds its download by the fixed asset names
  # LoupixDeck-Setup-win-x64.exe, LoupixDeck-Setup-win-arm64.exe and install-loupixdeck.sh and verifies it against the SHA-256
  # digest GitHub records for every release asset. Keep the names stable.
  publish-install-script:
    name: Publish install script
    runs-on: ubuntu-latest
    needs: build-linux
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Upload install script to release
        uses: softprops/action-gh-release@v3
        with:
          files: install-loupixdeck.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
